<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>BGSSAI Media</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="gate">
      <p class="brand">BGSSAI Media</p>
      <p class="tagline">一个应用，两个入口</p>
      <div class="actions">
        <button type="button" class="btn user" id="enter-user">
          用户入口
        </button>
        <button type="button" class="btn admin" id="enter-admin">
          管理入口
        </button>
      </div>
      <p class="hint">
        用户端与管理端共用本安装包，不提供独立 Admin / User 应用。
      </p>
    </main>
    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
