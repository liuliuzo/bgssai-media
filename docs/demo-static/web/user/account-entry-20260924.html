<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>登录 / 注册</title><main><h1>登录 / 注册</h1><p>未注册的手机号或邮箱验证后自动创建账号，资料稍后补充。</p><form onsubmit="event.preventDefault();document.getElementById('result').hidden=false"><label>手机号或邮箱<input required autocomplete="username"></label><button type="button" onclick="this.textContent='验证码已发送（原型）'">获取验证码</button><label>验证码<input required autocomplete="one-time-code"></label><button>登录 / 注册</button></form><p id="result" hidden>登录成功，个人资料可稍后补充。</p></main></html>
