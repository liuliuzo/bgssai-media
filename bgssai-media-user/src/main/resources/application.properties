server.port=8080
server.shutdown=graceful
spring.application.name=bgssai-media-user
spring.threads.virtual.enabled=true

spring.jackson.property-naming-strategy=SNAKE_CASE

mybatis.mapper-locations=classpath*:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

pagehelper.helper-dialect=mysql
pagehelper.reasonable=true

bgssai.media.jwt.secret=bgssai-media-user-local-jwt-secret-key-32b!
bgssai.media.jwt.expire-ms=86400000
bgssai.media.ingest.token=local-ingest-token-change-me

management.endpoints.web.exposure.include=health,info
spring.datasource.druid.initial-size=2
spring.datasource.druid.max-active=20

# MEDIA-01: blank mode = unconfigured (ingest FAILS). REFERENCE = URL passthrough; OBS needs obs.* keys.
bgssai.media.storage.mode=REFERENCE
bgssai.media.obs.endpoint=
bgssai.media.obs.bucket=
bgssai.media.obs.access-key=
bgssai.media.obs.secret-key=

# Chat third-party login (user only). No client secret in git. enabled=false = PREP.
bgssai.media.chat.oauth.enabled=false
bgssai.media.chat.oauth.authorize-url=https://chat.bgssai.com/oauth/authorize
bgssai.media.chat.oauth.token-url=https://chat.bgssai.com/oauth/token
bgssai.media.chat.oauth.userinfo-url=https://chat.bgssai.com/oauth/userinfo
bgssai.media.chat.oauth.client-id=bgssai-media-user
bgssai.media.chat.oauth.client-secret=
bgssai.media.chat.oauth.redirect-uri=http://127.0.0.1:3002/login/chat/callback
bgssai.media.chat.oauth.scope=openid profile
