spring.datasource.url=jdbc:mysql://127.0.0.1:3306/bgssai_media?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=bgssai
spring.datasource.password=bgssai_local
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
bgssai.media.jwt.secret=bgssai-media-user-dev-jwt-secret-key-please-rot!
bgssai.media.ingest.token=dev-ingest-token-placeholder
# --- Bot 安装包（不进 Git） ---
bgssai.bot.download.directory=/opt/bgssai/media/downloads/bot

# MEDIA-01: blank mode = unconfigured (ingest FAILS). REFERENCE = URL passthrough; OBS needs obs.* keys.
bgssai.media.storage.mode=REFERENCE
bgssai.media.obs.endpoint=
bgssai.media.obs.bucket=
bgssai.media.obs.access-key=
bgssai.media.obs.secret-key=

bgssai.media.chat.oauth.enabled=false
bgssai.media.chat.oauth.authorize-url=https://dev.user.bgssai-chat.cn/oauth/authorize
bgssai.media.chat.oauth.token-url=https://dev.user.bgssai-chat.cn/oauth/token
bgssai.media.chat.oauth.userinfo-url=https://dev.user.bgssai-chat.cn/oauth/userinfo
bgssai.media.chat.oauth.client-id=bgssai-media-user
bgssai.media.chat.oauth.client-secret=
bgssai.media.chat.oauth.redirect-uri=http://127.0.0.1:3002/login/chat/callback
bgssai.media.chat.oauth.scope=openid profile

# MEDIA-01 摄入可播放性探测：真取素材首包字节再判 READY。
# 关掉只会让摄入停在 PENDING（未验证 != 可播放），不会放行假 READY。
bgssai.media.probe.enabled=true
bgssai.media.probe.sniff-bytes=8192
bgssai.media.probe.connect-timeout-ms=4000
bgssai.media.probe.request-timeout-ms=10000
