spring.datasource.url=jdbc:mysql://127.0.0.1:3306/bgssai_media?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=bgssai
spring.datasource.password=bgssai_test_placeholder
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
bgssai.media.jwt.secret=bgssai-media-test-jwt-secret-key-please-rotate!
bgssai.media.ingest.token=test-ingest-token-placeholder

# MEDIA-01: blank mode = unconfigured (ingest FAILS). REFERENCE = URL passthrough; OBS needs obs.* keys.
bgssai.media.storage.mode=REFERENCE
bgssai.media.obs.endpoint=
bgssai.media.obs.bucket=
bgssai.media.obs.access-key=
bgssai.media.obs.secret-key=

bgssai.media.chat.oauth.enabled=false

# MEDIA-01 摄入可播放性探测：真取素材首包字节再判 READY。
# 关掉只会让摄入停在 PENDING（未验证 != 可播放），不会放行假 READY。
bgssai.media.probe.enabled=true
bgssai.media.probe.sniff-bytes=8192
bgssai.media.probe.connect-timeout-ms=4000
bgssai.media.probe.request-timeout-ms=10000
